<!DOCTYPE html>

label{

}

<body>

<h1>Wechselbild App Lite</h1>

<label>Bild A
<input type="file" id="imgA" accept="image/*">

<label>Bild B
<input type="file" id="imgB" accept="image/*">

<input type="file" id="imgC" accept="image/*">

<select id="preset">

</label>

<button onclick="generate()">Vorschau erzeugen</button>
<button onclick="downloadImage()">Bild herunterladen</button>

<div id="info"></div>

<canvas id="canvas"></canvas>

<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wechselbild App Lite</title>

<style>
body{
    font-family:Arial,sans-serif;
    max-width:1000px;
    margin:auto;
    padding:20px;
}
label{
    display:block;
    margin-top:10px;
}
canvas{
    max-width:100%;
    border:1px solid #ccc;
    margin-top:20px;
}
button{
    margin-top:15px;
    padding:10px;
}
</style>
</head>

<body>

<h1>Wechselbild App Lite</h1>

<label>Bild A
<input type="file" id="imgA" accept="image/*">
</label>

<label>Bild B
<input type="file" id="imgB" accept="image/*">
</label>

<label>Optional Bild C
<input type="file" id="imgC" accept="image/*">
</label>

<hr>

<label>Format
<select id="preset">
<option value="custom">Benutzerdefiniert</option>
<option value="21:9">21:9</option>
<option value="16:9">16:9</option>
<option value="4:3">4:3</option>
<option value="3:2">3:2</option>
<option value="1:1">1:1</option>
</select>
</label>

<label>Breite (mm)
<input type="number" id="widthMM" value="210">
</label>

<label>Höhe (mm)
<input type="number" id="heightMM" value="90">
</label>

<label>DPI
<select id="dpi">
<option>150</option>
<option selected>300</option>
<option>600</option>
</select>
</label>

<hr>

<label>Modus
<select id="mode">
<option value="count">Anzahl Streifen</option>
<option value="width">Streifenbreite (mm)</option>
</select>
</label>

<label>Anzahl Streifen
<input type="number" id="stripCount" value="24">
</label>

<label>Streifenbreite (mm)
<input type="number" id="stripWidthMM" value="1" step="0.1">
</label>

<label>Ausrichtung
<select id="orientation">
<option value="vertical">Vertikal</option>
<option value="horizontal">Horizontal</option>
</select>
</label>

<hr>

<label>Export
<select id="exportType">
<option value="image/jpeg">JPG</option>
<option value="image/png">PNG</option>
</select>
</label>

<button onclick="generate()">Vorschau erzeugen</button>
<button onclick="downloadImage()">Bild herunterladen</button>

<div id="info"></div>

<canvas id="canvas"></canvas>

<script>

function mmToPx(mm,dpi){
    return Math.round(mm*dpi/25.4);
}

function loadImage(file){
    return new Promise(resolve=>{
        const img=new Image();
        img.onload=()=>resolve(img);
        img.src=URL.createObjectURL(file);
    });
}

function cropInfo(img,targetW,targetH){

    const srcRatio=img.width/img.height;
    const dstRatio=targetW/targetH;

    let sx=0;
    let sy=0;
    let sw=img.width;
    let sh=img.height;

    if(srcRatio>dstRatio){
        sw=img.height*dstRatio;
        sx=(img.width-sw)/2;
    }else{
        sh=img.width/dstRatio;
        sy=(img.height-sh)/2;
    }

    return {sx,sy,sw,sh};
}

async function generate(){

    const files=[];

    if(imgA.files[0]) files.push(imgA.files[0]);
    if(imgB.files[0]) files.push(imgB.files[0]);
    if(imgC.files[0]) files.push(imgC.files[0]);

    if(files.length<2){
        alert("Bitte mindestens Bild A und Bild B auswählen.");
        return;
    }

    let widthMM=parseFloat(widthMMInput.value || widthMM.value);

    const dpi=parseInt(document.getElementById("dpi").value);

    let w=parseFloat(document.getElementById("widthMM").value);
    let h=parseFloat(document.getElementById("heightMM").value);

    const preset=document.getElementById("preset").value;

    if(preset!=="custom"){
        const r=preset.split(":");
        h=w*parseFloat(r[1])/parseFloat(r[0]);
        document.getElementById("heightMM").value=h.toFixed(1);
    }

    const width=mmToPx(w,dpi);
    const height=mmToPx(h,dpi);

    let strips;

    if(document.getElementById("mode").value==="count"){

        strips=parseInt(
            document.getElementById("stripCount").value
        );

    }else{

        const swmm=parseFloat(
            document.getElementById("stripWidthMM").value
        );

        const swpx=mmToPx(swmm,dpi);

        strips=Math.floor(
            (document.getElementById("orientation").value==="vertical"
            ? width
            : height)
            / swpx
        );
    }

    const imgs=[];

    for(const f of files){
        imgs.push(await loadImage(f));
    }

    const canvas=document.getElementById("canvas");

    canvas.width=width;
    canvas.height=height;

    const ctx=canvas.getContext("2d");

    const orientation=
        document.getElementById("orientation").value;

    for(let i=0;i<strips;i++){

        const img=imgs[i%imgs.length];

        const c=cropInfo(img,width,height);

        if(orientation==="vertical"){

            const sw=c.sw/strips;
            const dw=width/strips;

            ctx.drawImage(
                img,
                c.sx+i*sw,
                c.sy,
                sw,
                c.sh,
                i*dw,
                0,
                dw,
                height
            );

        }else{

            const sh=c.sh/strips;
            const dh=height/strips;

            ctx.drawImage(
                img,
                c.sx,
                c.sy+i*sh,
                c.sw,
                sh,
                0,
                i*dh,
                width,
                dh
            );
        }
    }

    document.getElementById("info").innerHTML=
        "<p><b>Pixel:</b> "+
        width+" × "+height+
        "<br><b>Streifen:</b> "+
        strips+
        "</p>";
}

function downloadImage(){

    const canvas=document.getElementById("canvas");

    const type=
        document.getElementById("exportType").value;

    const a=document.createElement("a");

    a.href=canvas.toDataURL(type,0.95);

    a.download=
        type==="image/png"
        ?"wechselbild.png"
        :"wechselbild.jpg";

    a.click();
}

</script>

</body>
