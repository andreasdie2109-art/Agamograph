<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wechselbild App Lite</title>

<style>
body{
    font-family:Arial,sans-serif;
    max-width:1000px;
    margin:auto;
    padding:20px;
    background: #f9f9f9;
}
label{
    display:block;
    margin-top:10px;
    font-weight: bold;
}
input, select {
    display: block;
    width: 100%;
    max-width: 300px;
    padding: 8px;
    margin-top: 5px;
    margin-bottom: 15px;
    border: 1px solid #ccc;
    border-radius: 4px;
}
canvas{
    max-width:100%;
    border:2px dashed #bbb;
    margin-top:20px;
    background: #fff;
}
button{
    margin-top:15px;
    padding:10px 20px;
    background-color: #007bff;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 16px;
}
button:hover {
    background-color: #0056b3;
}
#info {
    margin-top: 15px;
    padding: 10px;
    background: #e9ecef;
    border-left: 5px solid #007bff;
}
</style>
</head>

<body>

<h1>Wechselbild App Lite</h1>

<label>Bild A
<input type="file" id="imgA" accept="image/*">
</label>

<label>Bild B
<input type="file" id="imgB" accept="image/*">
</label>

<label>Optional Bild C
<input type="file" id="imgC" accept="image/*">
</label>

<hr>

<label>Format
<select id="preset">
<option value="custom">Benutzerdefiniert</option>
<option value="21:9">21:9</option>
<option value="16:9" selected>16:9</option>
<option value="4:3">4:3</option>
<option value="3:2">3:2</option>
<option value="1:1">1:1</option>
</select>
</label>

<label>Breite (mm)
<input type="number" id="widthMM" value="210">
</label>

<label>Höhe (mm)
<input type="number" id="heightMM" value="118">
</label>

<label>DPI
<select id="dpi">
<option>150</option>
<option selected>300</option>
<option>600</option>
</select>
</label>

<hr>

<label>Modus
<select id="mode">
<option value="count" selected>Anzahl Streifen</option>
<option value="width">Streifenbreite (mm)</option>
</select>
</label>

<label>Anzahl Streifen
<input type="number" id="stripCount" value="30">
</label>

<label>Streifenbreite (mm)
<input type="number" id="stripWidthMM" value="2" step="0.1">
</label>

<label>Ausrichtung
<select id="orientation">
<option value="vertical" selected>Vertikal</option>
<option value="horizontal">Horizontal</option>
</select>
</label>

<hr>

<label>Export
<select id="exportType">
<option value="image/jpeg">JPG</option>
<option value="image/png">PNG</option>
</select>
</label>

<button onclick="generate()">Vorschau erzeugen</button>
<button onclick="downloadImage()">Bild herunterladen</button>

<div id="info">Bitte Bilder auswählen und auf "Vorschau erzeugen" klicken.</div>

<canvas id="canvas"></canvas>

<script>

function mmToPx(mm, dpi) {
    return Math.round(mm * dpi / 25.4);
}

function loadImage(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = function(event) {
            const img = new Image();
            img.onload = () => resolve(img);
            img.onerror = () => reject(new Error("Bilddaten fehlerhaft."));
            img.src = event.target.result;
        };
        reader.onerror = () => reject(new Error("Datei konnte nicht gelesen werden."));
        reader.readAsDataURL(file);
    });
}

function cropInfo(img, targetW, targetH) {
    const srcRatio = img.width / img.height;
    const dstRatio = targetW / targetH;

    let sx = 0, sy = 0, sw = img.width, sh = img.height;

    if (srcRatio > dstRatio) {
        sw = img.height * dstRatio;
        sx = (img.width - sw) / 2;
    } else {
        sh = img.width / dstRatio;
        sy = (img.height - sh) / 2;
    }

    return { sx, sy, sw, sh };
}

async function generate() {
    const infoDiv = document.getElementById("info");
    infoDiv.innerHTML = "Verarbeite Bilder... Bitte warten...";

    try {
        const files = [];
        const inputA = document.getElementById("imgA");
        const inputB = document.getElementById("imgB");
        const inputC = document.getElementById("imgC");

        if (inputA.files[0]) files.push(inputA.files[0]);
        if (inputB.files[0]) files.push(inputB.files[0]);
        if (inputC.files[0]) files.push(inputC.files[0]);

        if (files.length < 2) {
            alert("Bitte wähle mindestens Bild A und Bild B aus!");
            infoDiv.innerHTML = "<span style='color:red;'>Fehler: Zu wenige Bilder ausgewählt.</span>";
            return;
        }

        const dpi = parseInt(document.getElementById("dpi").value);
        let w = parseFloat(document.getElementById("widthMM").value);
        let h = parseFloat(document.getElementById("heightMM").value);

        const preset = document.getElementById("preset").value;
        if (preset !== "custom") {
            const r = preset.split(":");
            h = w * parseFloat(r[1]) / parseFloat(r[0]);
            document.getElementById("heightMM").value = h.toFixed(1);
        }

        const width = mmToPx(w, dpi);
        const height = mmToPx(h, dpi);

        let strips;
        const mode = document.getElementById("mode").value;

        if (mode === "count") {
            strips = parseInt(document.getElementById("stripCount").value);
        } else {
            const swmm = parseFloat(document.getElementById("stripWidthMM").value);
            const swpx = mmToPx(swmm, dpi);
            const totalPx = (document.getElementById("orientation").value === "vertical") ? width : height;
            strips = Math.floor(totalPx / swpx);
        }

        // Sicherheitsprüfung: Falls strips 0 oder NaN ist, Standardwert setzen
        if (!strips || strips <= 0) {
            strips = 20; 
            document.getElementById("stripCount").value = 20;
        }

        const imgs = [];
        for (const f of files) {
            imgs.push(await loadImage(f));
        }

        const canvas = document.getElementById("canvas");
        canvas.width = width;
        canvas.height = height;

        const ctx = canvas.getContext("2d");
        ctx.clearRect(0, 0, width, height);
        
        const orientation = document.getElementById("orientation").value;

        for (let i = 0; i < strips; i++) {
            const img = imgs[i % imgs.length];
            const c = cropInfo(img, width, height);

            if (orientation === "vertical") {
                const sw = c.sw / strips;
                const dw = width / strips;
                ctx.drawImage(img, c.sx + i * sw, c.sy, sw, c.sh, i * dw, 0, dw, height);
            } else {
                const sh = c.sh / strips;
                const dh = height / strips;
                ctx.drawImage(img, c.sx, c.sy + i * sh, c.sw, sh, 0, i * dh, width, dh);
            }
        }

        infoDiv.innerHTML = `<strong>Vorschau erfolgreich geladen!</strong><br>Pixelgröße: ${width} × ${height} px<br>Berechnete Streifen: ${strips}`;

    } catch (error) {
        alert("Fehler: " + error.message);
        infoDiv.innerHTML = "<span style='color:red;'>Fehler bei der Berechnung.</span>";
    }
}

function downloadImage() {
    const canvas = document.getElementById("canvas");
    const type = document.getElementById("exportType").value;
    const a = document.createElement("a");
    a.href = canvas.toDataURL(type, 0.95);
    a.download = type === "image/png" ? "wechselbild.png" : "wechselbild.jpg";
    a.click();
}
</script>

</body>
</html>
