
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wechselbild App Lite 1.1</title>

<style>
body {
  font-family: Arial, sans-serif;
  max-width: 800px;
  margin: auto;
  padding: 16px;
  line-height: 1.5;
  background: #f7f7f7;
}
h1 { font-size: 1.6em; }
.panel {
  background: white;
  padding: 16px;
  border-radius: 12px;
  margin-bottom: 16px;
}
label { display: block; margin: 12px 0; }
input, select, button {
  box-sizing: border-box;
  max-width: 100%;
  padding: 10px;
  font-size: 16px;
}
input[type="number"], select { width: 100%; }
input[type="file"] { width: 100%; }
button {
  width: 100%;
  margin-top: 10px;
  border: 0;
  border-radius: 8px;
  background: #174ea6;
  color: white;
}
button:disabled { opacity: .5; }
#status { white-space: pre-line; }
canvas {
  display: block;
  width: 100%;
  height: auto;
  margin-top: 16px;
  border: 1px solid #bbb;
  background: white;
}
.small { color: #555; font-size: .9em; }
</style>
</head>

<body>
<h1>Wechselbild Generator 1.1</h1>
<p>Erstelle Wechselbilder aus zwei oder drei Fotos.</p>

<div class="panel">
  <h2>1. Bilder auswählen</h2>
  <label>Bild A
    <input type="file" id="imgA" accept="image/*">
  </label>
  <label>Bild B
    <input type="file" id="imgB" accept="image/*">
  </label>
  <label>Bild C (optional)
    <input type="file" id="imgC" accept="image/*">
  </label>
</div>

<div class="panel">
  <h2>2. Ausgabeformat</h2>
  <label>Seitenverhältnis
    <select id="preset">
      <option value="custom">Benutzerdefiniert</option>
      <option value="21:9">21:9</option>
      <option value="16:9">16:9</option>
      <option value="4:3">4:3</option>
      <option value="3:2">3:2</option>
      <option value="1:1">1:1</option>
    </select>
  </label>
  <label>Breite (mm)
    <input type="number" id="widthMM" value="210" min="1" step="0.1">
  </label>
  <label>Höhe (mm)
    <input type="number" id="heightMM" value="90" min="1" step="0.1">
  </label>
  <label>Auflösung (DPI)
    <select id="dpi">
      <option value="150">150 DPI</option>
      <option value="300" selected>300 DPI</option>
      <option value="600">600 DPI</option>
      <option value="1200">1200 DPI</option>
    </select>
  </label>
  <p class="small">Bei einem festen Seitenverhältnis wird die Höhe anhand der Breite berechnet.</p>
</div>

<div class="panel">
  <h2>3. Streifen einstellen</h2>
  <label>Berechnung
    <select id="mode">
      <option value="count">Anzahl Streifen vorgeben</option>
      <option value="width">Streifenbreite in mm vorgeben</option>
    </select>
  </label>
  <label>Anzahl Streifen
    <input type="number" id="stripCount" value="24" min="1" max="2000">
  </label>
  <label>Streifenbreite (mm)
    <input type="number" id="stripWidthMM" value="1" min="0.01" step="0.1">
  </label>
  <label>Ausrichtung
    <select id="orientation">
      <option value="vertical">Vertikale Streifen</option>
      <option value="horizontal">Horizontale Streifen</option>
    </select>
  </label>
</div>

<div class="panel">
  <h2>4. Ergebnis</h2>
  <label>Dateiformat
    <select id="exportType">
      <option value="image/jpeg">JPG</option>
      <option value="image/png">PNG</option>
    </select>
  </label>
  <button id="generateBtn" type="button">Wechselbild erzeugen</button>
  <button id="downloadBtn" type="button" disabled>Bild herunterladen</button>
  <div id="status" role="status">Bitte Bilder auswählen.</div>
  <canvas id="canvas" hidden></canvas>
</div>

<script>
"use strict";

const $ = id => document.getElementById(id);
let generated = false;

function mmToPx(mm, dpi) {
  return Math.round(mm * dpi / 25.4);
}

function loadImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);

    img.onload = () => {
      URL.revokeObjectURL(url);
      resolve(img);
    };
    img.onerror = () => {
      URL.revokeObjectURL(url);
      reject(new Error("Ein Bild konnte nicht geladen werden."));
    };
    img.src = url;
  });
}

// Mittig zuschneiden, damit jedes Foto das Zielformat ausfüllt.
function cropInfo(img, targetW, targetH) {
  const sourceRatio = img.width / img.height;
  const targetRatio = targetW / targetH;

  let sx = 0, sy = 0, sw = img.width, sh = img.height;

  if (sourceRatio > targetRatio) {
    sw = img.height * targetRatio;
    sx = (img.width - sw) / 2;
  } else {
    sh = img.width / targetRatio;
    sy = (img.height - sh) / 2;
  }

  return { sx, sy, sw, sh };
}

function setStatus(message) {
  $("status").textContent = message;
}

async function generate() {
  const button = $("generateBtn");
  button.disabled = true;
  $("downloadBtn").disabled = true;
  generated = false;

  try {
    const files = ["imgA", "imgB", "imgC"]
      .map(id => $(id).files[0])
      .filter(Boolean);

    if (files.length < 2) {
      throw new Error("Bitte mindestens Bild A und Bild B auswählen.");
    }

    const dpi = Number($("dpi").value);
    const wmm = Number($("widthMM").value);
    let hmm = Number($("heightMM").value);
    const preset = $("preset").value;

    if (!Number.isFinite(wmm) || wmm <= 0 ||
        !Number.isFinite(hmm) || hmm <= 0) {
      throw new Error("Breite und Höhe müssen größer als null sein.");
    }

    if (preset !== "custom") {
      const [ratioW, ratioH] = preset.split(":").map(Number);
      hmm = wmm * ratioH / ratioW;
      $("heightMM").value = hmm.toFixed(2);
    }

    const width = mmToPx(wmm, dpi);
    const height = mmToPx(hmm, dpi);

    // Schutz vor versehentlich extrem großen Bildern.
    if (width < 1 || height < 1 ||
        width * height > 40000000) {
      throw new Error(
        "Das Bild ist zu groß für eine zuverlässige Verarbeitung. " +
        "Bitte geringere Maße oder eine niedrigere DPI wählen."
      );
    }

    const orientation = $("orientation").value;
    let strips;

    if ($("mode").value === "count") {
      strips = Number($("stripCount").value);

      if (!Number.isInteger(strips) || strips < 1 || strips > 2000) {
        throw new Error("Die Streifenanzahl muss zwischen 1 und 2000 liegen.");
      }
    } else {
      const stripeMM = Number($("stripWidthMM").value);

      if (!Number.isFinite(stripeMM) || stripeMM <= 0) {
        throw new Error("Die Streifenbreite muss größer als null sein.");
      }

      const stripePx = mmToPx(stripeMM, dpi);
      if (stripePx < 1) {
        throw new Error("Die Streifenbreite ist bei dieser DPI zu klein.");
      }

      const length = orientation === "vertical" ? width : height;
      strips = Math.max(1, Math.ceil(length / stripePx));
      strips = Math.min(strips, 2000);
    }

    setStatus("Bilder werden verarbeitet …");

    const imgs = await Promise.all(files.map(loadImage));
    const canvas = $("canvas");
    canvas.width = width;
    canvas.height = height;

    const ctx = canvas.getContext("2d");
    if (!ctx) throw new Error("Die Bildverarbeitung ist nicht verfügbar.");

    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, width, height);

    imgs.forEach(img => {
      if (!img.width || !img.height) {
        throw new Error("Ein ausgewähltes Bild ist ungültig.");
      }
    });

    for (let i = 0; i < strips; i++) {
      const img = imgs[i % imgs.length];
      const c = cropInfo(img, width, height);

      if (orientation === "vertical") {
        const x0 = Math.round(i * width / strips);
        const x1 = Math.round((i + 1) * width / strips);
        const sx0 = c.sx + i * c.sw / strips;
        const sx1 = c.sx + (i + 1) * c.sw / strips;

        ctx.drawImage(
          img, sx0, c.sy, sx1 - sx0, c.sh,
          x0, 0, x1 - x0, height
        );
      } else {
        const y0 = Math.round(i * height / strips);
        const y1 = Math.round((i + 1) * height / strips);
        const sy0 = c.sy + i * c.sh / strips;
        const sy1 = c.sy + (i + 1) * c.sh / strips;

        ctx.drawImage(
          img, c.sx, sy0, c.sw, sy1 - sy0,
          0, y0, width, y1 - y0
        );
      }
    }

    canvas.hidden = false;
    generated = true;
    $("downloadBtn").disabled = false;

    setStatus(
      "Fertig!\n" +
      "Ausgabe: " + wmm.toFixed(2) + " × " + hmm.toFixed(2) + " mm\n" +
      "Pixel: " + width + " × " + height + "\n" +
      "Auflösung: " + dpi + " DPI\n" +
      "Streifen: " + strips + "\n" +
      "Verwendete Bilder: " + imgs.length
    );
  } catch (error) {
    setStatus("Fehler: " + error.message);
    alert(error.message);
  } finally {
    button.disabled = false;
  }
}

function downloadImage() {
  if (!generated) {
    alert("Bitte zuerst ein Wechselbild erzeugen.");
    return;
  }

  const canvas = $("canvas");
  const type = $("exportType").value;
  const filename = type === "image/png"
    ? "wechselbild.png"
    : "wechselbild.jpg";

  canvas.toBlob(blob => {
    if (!blob) {
      alert("Das Bild konnte nicht exportiert werden.");
      return;
    }

    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }, type, 0.95);
}

$("generateBtn").addEventListener("click", generate);
$("downloadBtn").addEventListener("click", downloadImage);

// Beim Ändern eines festen Formats die Höhe direkt aktualisieren.
$("preset").addEventListener("change", () => {
  const preset = $("preset").value;
  if (preset === "custom") return;

  const [rw, rh] = preset.split(":").map(Number);
  const w = Number($("widthMM").value);

  if (w > 0) $("heightMM").value = (w * rh / rw).toFixed(2);
});
</script>
</body>
</html>
